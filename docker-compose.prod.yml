services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    command:
      - "--entrypoints.web.address=:8000"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.forwardedHeaders.trustedIPs=127.0.0.1/32,172.16.0.0/12"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: unless-stopped
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: aba-reestr-image
    pull_policy: build
    command: ["php", "/var/www/html/artisan", "octane:frankenphp"]
    volumes:
      - ./storage:/var/www/html/storage
      - ./public:/var/www/html/public
    user: "${WWWUSER}:${WWWGROUP}"
    environment:
      - XDG_CONFIG_HOME=/tmp
    depends_on:
      pgsql:
        condition: service_healthy
      memcached:
        condition: service_started
      meilisearch:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.routers.app.rule=Host(`aba-expert.ru`, `api.aba-expert.ru`, `dev.aba-expert.ru`)"
      - "traefik.http.services.app.loadbalancer.server.port=8000"

  horizon:
    image: aba-reestr-image
    pull_policy: never
    command: ["php", "/var/www/html/artisan", "horizon"]
    volumes:
      - ./storage:/var/www/html/storage
      - ./public:/var/www/html/public
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck-horizon"]
      start_period: 10s
    depends_on:
      - app
      - pgsql
      - redis
    restart: unless-stopped
    networks:
      - app-network

  scheduler:
    image: aba-reestr-image
    pull_policy: never
    command: ["/bin/sh", "-c", "while true; do php /var/www/html/artisan schedule:run; sleep 60; done"]
    volumes:
      - ./storage:/var/www/html/storage
      - ./public:/var/www/html/public
    user: "${WWWUSER}:${WWWGROUP}"
    healthcheck:
      test: ["CMD", "php", "/var/www/html/artisan", "schedule:run", "--no-interaction"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - app
      - pgsql
      - redis
    restart: unless-stopped
    networks:
      - app-network

  pgsql:
    image: 'postgres:17'
    ports:
      - '127.0.0.1:${FORWARD_DB_PORT:-5432}:5432'
    environment:
      PGPASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - 'pgsql:/var/lib/postgresql/data'
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
      interval: 5s
      retries: 10
      timeout: 5s

  memcached:
    image: 'memcached:alpine'
    expose:
      - "11211"
    restart: unless-stopped
    networks:
      - app-network

  meilisearch:
    image: getmeili/meilisearch:v1.11.3
    environment:
      MEILI_NO_ANALYTICS: "true"
    expose:
      - "7700"
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgsql:
    driver: local
  meili_data:
    driver: local
  redis-data:
    driver: local
